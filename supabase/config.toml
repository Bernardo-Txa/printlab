# Local Supabase configuration for PrintLab database tooling.
# No remote credentials or secrets belong in this file.
project_id = "printlab"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false
port = 54324

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = false
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental.pgdelta]
enabled = true
